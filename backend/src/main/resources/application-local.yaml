# Local development: matches docker-compose.yml at the repository root.
# Defaults are fine here because they only work against the local Docker database.
spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5434/authreflector}
    username: ${AUTH_DB_USERNAME:authreflector}
    password: ${AUTH_DB_PASSWORD:authreflector_dev}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Dev-only signing keys, created by scripts/generate-dev-keys.sh (git-ignored, never shared).
authreflector:
  signing-key:
    key-id: ${AUTH_SIGNING_KEY_ID:dev-key-1}
    public-key-location: ${AUTH_SIGNING_PUBLIC_KEY:file:secrets/dev-public.pem}
    private-key-location: ${AUTH_SIGNING_PRIVATE_KEY:file:secrets/dev-private.pem}
