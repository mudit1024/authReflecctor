# Shared configuration for every environment.
# Secrets never have defaults here: a deployed app without them must fail at startup.
spring:
  application:
    name: authreflector

  profiles:
    # Used only when no profile is set explicitly (e.g. running from the IDE).
    # Production sets SPRING_PROFILES_ACTIVE=prod, which replaces this.
    default: local

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it and never changes tables.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB connection open while the HTTP response is being rendered.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  # 9000 keeps clear of SplitMate (8080) and Vite (5173).
  port: 9000
  servlet:
    session:
      # The SSO session: how long you stay signed in without activity (design doc 7, PROPOSED 7 days)
      timeout: 7d
      cookie:
        # Own name: cookies are shared across ports on localhost, so the default JSESSIONID would
        # collide with SplitMate's (design doc 15)
        name: AR_SESSION
        http-only: true
        same-site: lax
        # HTTPS-only in production; the local profile turns this off for http://localhost
        secure: true

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed over HTTP; everything else stays internal.
        include: health
  endpoint:
    health:
      # Load balancers and Docker only need UP/DOWN, not database details.
      show-details: never

authreflector:
  signing-key:
    # No defaults: production must provide its own key pair (e.g. from AWS Secrets Manager).
    key-id: ${AUTH_SIGNING_KEY_ID}
    public-key-location: ${AUTH_SIGNING_PUBLIC_KEY}
    private-key-location: ${AUTH_SIGNING_PRIVATE_KEY}
