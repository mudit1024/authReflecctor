name: AuthReflector CI

# PRs are checked before merge; main is re-checked after every merge.
# (Not "push" on every branch: that would run each PR build twice.)
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older, now pointless run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # No database service here: Testcontainers starts its own postgres:17
      # (Docker is available on GitHub's Ubuntu runners), exactly as on a developer machine.
      # -Pui also builds the React app into the jar, so a broken packaging step fails the PR too.
      - name: Build (with UI) and test
        working-directory: backend
        run: ./mvnw -B -Pui clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  client-starter:
    name: Client starter (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test the Spring Boot client starter
        working-directory: client
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # JS SDK for frontend-only apps
      - name: SDK install
        working-directory: sdk/web
        run: npm ci --no-audit --no-fund

      - name: SDK type check and tests
        working-directory: sdk/web
        run: npm run lint && npm test
